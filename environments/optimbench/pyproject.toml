[project]
name = "optimbench-env"
description = "Verifiable dynamic vehicle dispatch (CVRPTW with mid-episode disruptions), scored by a deterministic reward. Prime Intellect hub wrapper for the optimbench library."
tags = ["multi-turn", "verifiable", "optimization", "dispatch", "train", "eval"]
version = "0.0.1"
requires-python = ">=3.10"
dependencies = ["verifiers>=0.1.8", "optimbench>=0.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["optimbench_env.py", "pyproject.toml", "README.md"]

[tool.hatch.build.targets.wheel]
py-modules = ["optimbench_env"]

[tool.verifiers.eval]
num_examples = 20
rollouts_per_example = 3
